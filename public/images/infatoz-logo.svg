    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#infatozGrad)" />
    <!-- Dynamic Isometric / Geometric Nodes -->
    <path d="M16 12L32 12C34.2091 12 36 13.7909 36 16L36 20C36 22.2091 34.2091 24 32 24L26 24L26 32C26 34.2091 24.2091 36 22 36L16 36C13.7909 36 12 34.2091 12 32L12 16C12 13.7909 13.7909 12 16 12Z" fill="white" fill-opacity="0.95" />
    <circle cx="32" cy="32" r="4.5" fill="url(#accentGlow)" />
    <path d="M20 20L28 20" stroke="#1E40AF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wordmark Text (Dark text for Light Backgrounds) -->
  <text x="64" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="-0.03em" fill="#0F172A">
    INFATOZ<tspan fill="#2563EB">.</tspan>
  </text>
  <text x="64.5" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.22em" fill="#64748B">
    TECHNOLOGIES
  </text>
</svg>
