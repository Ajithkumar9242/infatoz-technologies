<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none" width="100%" height="100%" aria-label="Infatoz Technologies Logo">
  <defs>
    <linearGradient id="infatozGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Infatoz Brand Emblem -->
  <g transform="translate(4, 4)">
